# SYSPIN-only profile: the chains a box with no HF_TOKEN can actually serve.
#
# Why this file exists. `tts setup` against the default tts_chains.yaml exits
# non-zero on a token-less machine, naming indic_parler and indicf5 as
# unprovisioned -- deliberately, because a chain that names a model nobody
# downloaded is a half-set-up deployment, and skipping it silently is how a
# language quietly renders nothing. The honest way to run without the gated
# models is therefore to *say so in configuration*, not to let setup shrug:
#
#     make setup-tts TTS_CONFIG=tts_chains.syspin-only.yaml
#     python -m app.tts_runtime --config tts_chains.syspin-only.yaml run spec.json
#
# What you give up: there is no failover. A line SYSPIN cannot speak is
# flagged, because nothing follows it in the chain -- which is exactly the
# behaviour the default config has today anyway, since the other two models
# are not provisioned. The difference is that here it is a stated choice.
#
# Languages: only the five SYSPIN speaks. ta/ml/gu/pa/or/as are absent on
# purpose -- with no gated model there is nothing to render them, and
# `submit()` refuses a line whose chain cannot speak its language rather than
# queueing it to be flagged forever.
chains:
  hi: [syspin]
  mr: [syspin]
  bn: [syspin]
  te: [syspin]
  kn: [syspin]
  default: [syspin]

# SYSPIN only, so the one measured bound applies (docs/tts-benchmark.md: a
# sentence takes 6.1-7.2 s, a short line 10.6-14.1 s; 60 s is ~4x the worst).
timeouts:
  synth_s: 60
  check_s: 30

retries: { per_model: 1, network_backoff: [2, 4, 8, 16, 32, 60, 120, 300] }
circuit_breaker: { window: 20, fail_ratio: 0.30, cooldown_s: 600, min_samples: 10 }
known_bad: { auto_add_after: "3 of last 5", auto_remove: false }
scene_consistency: true
max_models_on_gpu: 2
offline_mode: auto
carrier: { syspin: true }
disk: { min_free_mb: 2048 }
readers: { te: [vakyansh], kn: [vakyansh] }
