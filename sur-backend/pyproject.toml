[project]
name = "sur-backend"
version = "0.1.0"
description = "Sur -- emotion-aware AI dubbing pipeline backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
markers = [
    "timeline: audio/video sync correctness, needs real ffmpeg (CONTRACTS.md #3)",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
